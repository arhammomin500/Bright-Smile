# Render Blueprint — free static site (no backend, no database).
#
# NOTE for first-time switch from the old Node web service: Render cannot
# convert a web service into a static site. Delete the old "bright-smile"
# web service in the dashboard, then Blueprint → Manual sync to create this
# static site. Static sites on Render are free, always-on (no cold starts),
# served over a global CDN, and support custom domains with automatic HTTPS.
services:
  - type: web
    name: bright-smile
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: client/dist
    routes:
      # SPA fallback — refreshing any route serves the app instead of a 404.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Hashed build assets can be cached hard; index.html is revalidated by default.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=2592000, immutable
