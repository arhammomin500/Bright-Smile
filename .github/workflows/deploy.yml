# Builds the static site and publishes it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # SPA fallback: GitHub Pages serves 404.html for unknown paths, so deep
      # links like /treatments/dental-implants load the app instead of a 404.
      - name: Add SPA fallback
        run: cp client/dist/index.html client/dist/404.html
      # Real HTML copies for every known route → HTTP 200 (indexable by
      # search engines) instead of the 404-status fallback.
      - name: Static copies for deep links
        run: |
          cd client/dist
          routes="about treatments dentist reviews book-appointment contact privacy terms blog gallery"
          for s in $(grep -o "slug: '[a-z0-9-]*'" ../src/data/treatments.ts | sed "s/slug: '//;s/'//"); do routes="$routes treatments/$s"; done
          for s in $(grep -o "slug: '[a-z0-9-]*'" ../src/data/blog.ts | sed "s/slug: '//;s/'//"); do routes="$routes blog/$s"; done
          for r in $routes; do mkdir -p "$r"; cp index.html "$r/index.html"; done
          echo "created $(echo $routes | wc -w) route copies"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
